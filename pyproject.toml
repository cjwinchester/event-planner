[project]
name = "event-planner"
version = "0.1.0"
description = "Open-source, multi-tenant event planning for nonprofits: content + logistics planning, pitches, scheduling, publishing."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Cody Winchester" }]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.2",
    "cryptography>=50.0.2",
    "django>=6.1.3",
    "django-allauth[socialaccount]>=65.22.1",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "django-storages[s3]>=1.14.6",
    "django-tasks-db>=0.13.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.1",
    "icalendar>=7.3.0",
    "jsonschema>=4.26.0",
    "nh3>=0.3.7",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "requests>=2.34.2",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[project.optional-dependencies]
# AI query assistant (apps/assistant/providers/anthropic_provider.py)
ai = ["anthropic"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "--reuse-db -q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "RUF"]
# RUF012: Django ModelAdmin/Meta use plain mutable class attributes by design.
# RUF001-003: en dashes in human-facing text (time ranges) are intentional.
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]
